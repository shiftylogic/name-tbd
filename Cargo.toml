[workspace]
members = [
    "demos/play",
    #"demos/bevy-play",
    "demos/gpui-play",
]
resolver = "2"


[workspace.dependencies]
env_logger = { version = "0.11.8", default-features = false }
log = { version = "0.4.28", default-features = false }


[profile.dev]
debug = 2
lto = false
opt-level = 0

# For 3rd party packages, or slow happens
[profile.dev.package."*"]
opt-level = 3


# For release / distribution, make go faster!
[profile.release]
debug = 0
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true

