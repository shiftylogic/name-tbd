[workspace]
members = [
    "demos/play",
    #"demos/bevy-play",
    #"demos/gpui-play",
    "demos/iced-play",
]
resolver = "2"


[workspace.package]
edition = "2024"
license = "MIT"

authors = [ "Robert Anderson (https://shiftylogic.dev)" ]
homepage = "https://www.shiftylogic.com"
repository = "https://github.com/shiftylogic/name-tbd"


[workspace.dependencies.clap]
version = "4.5.51"
default-features = false
features = ["std", "color", "help", "usage", "error-context"]

[workspace.dependencies.env_logger]
version = "0.11.8"
default-features = false

[workspace.dependencies.log]
version = "0.4.28"
default-features = false


[profile.dev]
debug = 2
lto = false
opt-level = 0

# For 3rd party packages, or slow happens
[profile.dev.package."*"]
opt-level = 3


# For release / distribution, make go faster!
[profile.release]
debug = 0
lto = "thin"
opt-level = 3
codegen-units = 1
strip = true

